<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/game.css" />
    <script src="assets/game.js" defer></script>
    <title>Battleship</title>
</head>
<body>
    <div class="boards">
        <div class="side">
            <h2 class="board-name-player">Your Game Board</h2>
            <div class="board player"></div>
        </div>
        <div class="side">
            <h2 class="board-name-opponent">Your Ships</h2>
            <div class="board opponent hidden"></div>
            <div class="shipyard"></div>
        </div>
    </div>
    <div class="button-wrapper">
        <button class="button-rotate">&#128472;</button>
        <button class="button-reset">&#8634;</button>
        <button class="button-ready" disabled>&#9656;</button>
    </div>
